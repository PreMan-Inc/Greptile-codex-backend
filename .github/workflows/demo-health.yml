name: Public demo health

# Runs against the deployed demo URL, so a red run here means the deployment
# drifted from the repository, not that the commit under test is broken.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify health, both API contracts, and the browser test UI
        env:
          BASE_URL: ${{ vars.DEMO_BASE_URL }}
        run: python scripts/check_live.py
