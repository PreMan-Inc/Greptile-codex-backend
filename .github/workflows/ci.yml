name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest --cov=app --cov-report=term-missing
      - run: uv run python scripts/check_contract.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run python scripts/export_mock_schemas.py --check
      - run: docker build -t greptile-codex-backend:test .
